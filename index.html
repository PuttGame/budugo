<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=2400, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Budugo</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height:100%; overflow:hidden; background:#000; color:#0f0;
      font-family:'Press Start 2P',monospace; user-select:none; touch-action:none;
    }
    body {
      display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    }
    .pass {
      font-size:12px; letter-spacing:8px; opacity:0.7; margin-bottom:60px;
    }
    #installBtn {
      position:fixed; bottom:32px; left:50%; transform:translateX(-50%);
      background:#111; color:#0f0; border:1px solid #0f0; padding:12px 24px;
      font-size:10px; border-radius:6px; cursor:pointer; display:none; z-index:999;
    }
    #installBtn:hover { background:#0f03; }

    @media (min-width:1025px), (orientation:portrait) {
      .pass { display:none; }
      body::before {
        content:"HANYA UNTUK PONSEL MODE LANDSCAPE"; position:fixed; inset:0;
        background:#000; color:red; font-size:20px; display:flex; align-items:center; justify-content:center;
        padding:40px; text-align:center; z-index:1000;
      }
    }
  </style>
</head>
<body>
  <div class="pass">pass</div>
  <button id="installBtn">Install App</button>

  <script>
    // Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('SW OK'))
          .catch(err => console.error('SW error:', err));
      });
    }

    // Install prompt
    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('Outcome:', outcome);
        deferredPrompt = null;
        installBtn.style.display = 'none';
      }
    });

    // Force fullscreen & landscape
    async function forceMode() {
      if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
        await document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(()=>{});
      }
      if (screen.orientation?.lock) {
        await screen.orientation.lock('landscape-primary').catch(()=>{});
      }
    }

    window.addEventListener('load', forceMode);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') forceMode();
    });

    // Prevent scroll/zoom
    document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });
    document.addEventListener('gesturestart', e => e.preventDefault());

    // Simulasi engagement >30 detik
    setTimeout(() => {
      console.log('Engagement simulated >30s');
    }, 35000);
  </script>
</body>
</html>
